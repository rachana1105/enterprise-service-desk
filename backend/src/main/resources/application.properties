# All credentials come from environment variables. There are deliberately no fallback
# secrets: the application refuses to start if DB_USER, DB_PASSWORD or JWT_SECRET is missing.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/servicedesk}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# validate = never alter an existing schema. Use JPA_DDL_AUTO=update only for the first run
# against a new, empty local database (see docs/OPERATIONS.md).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
# Return RFC 9457 problem details (status + "detail" message) that the React client displays.
spring.mvc.problemdetails.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=8080
app.jwt.secret=${JWT_SECRET}
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}
